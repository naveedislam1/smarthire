# SmartHire — monorepo workspace root.
#
# This root is NOT an application; it only defines the uv workspace and the
# shared dev tooling. Each microservice lives under services/* and the shared
# library under libs/*. `uv sync --all-packages` installs everything into one
# dev environment.
[project]
name = "smarthire-workspace"
version = "0.2.0"
description = "SmartHire — fault-isolated recruitment microservices (monorepo root)."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Auto-generated Alembic revisions are excluded from style linting.
extend-exclude = ["**/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
