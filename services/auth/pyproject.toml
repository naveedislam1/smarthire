[project]
name = "smarthire-auth"
version = "0.1.0"
description = "SmartHire auth service — users, RS256 JWT issuance."
requires-python = ">=3.12"
dependencies = [
    "smarthire-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

# Run from source (local `app/`); not installed, to avoid `app` name collisions
# across services in the shared workspace venv.
[tool.uv]
package = false

[tool.uv.sources]
smarthire-common = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
