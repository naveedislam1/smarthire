[project]
name = "smarthire-gateway"
version = "0.1.0"
description = "SmartHire API gateway — routing, JWT-aware proxy, circuit breakers, rate limiting."
requires-python = ">=3.12"
dependencies = [
    "smarthire-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "redis>=5.0",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

# Run from source (local `app/`); not installed, to avoid `app` name collisions
# across services in the shared workspace venv.
[tool.uv]
package = false

[tool.uv.sources]
smarthire-common = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
