[project]
name = "smarthire-jobs"
version = "0.1.0"
description = "SmartHire jobs service — jobs CRUD + Temporal publishing workflow."
requires-python = ">=3.12"
dependencies = [
    "smarthire-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "temporalio>=1.7",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "aiosqlite>=0.20"]

[tool.uv]
package = false

[tool.uv.sources]
smarthire-common = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
